<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#845ef7"/>
      <stop offset="1" stop-color="#5c7cfa"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere outline: a brain in side profile with lobed back -->
    <path d="
      M 568 252
      C 504 220, 436 232, 396 280
      C 332 280, 288 332, 296 388
      C 244 412, 232 484, 280 524
      C 252 568, 272 632, 320 652
      C 320 712, 376 756, 436 748
      C 472 788, 540 792, 568 760
      L 568 252 Z
    "/>

    <!-- Spiral gyrus inside the hemisphere -->
    <path d="
      M 432 528
      C 388 528, 388 600, 444 600
      C 488 600, 488 552, 452 552
      C 428 552, 428 580, 452 580
    "/>

    <!-- Vertical central divider -->
    <line x1="568" y1="252" x2="568" y2="800"/>

    <!-- Three network connection arms -->
    <line x1="568" y1="340" x2="676" y2="340"/>
    <line x1="568" y1="512" x2="700" y2="512"/>
    <line x1="568" y1="684" x2="676" y2="684"/>

    <!-- Three network nodes -->
    <circle cx="740" cy="340" r="56"/>
    <circle cx="764" cy="512" r="56"/>
    <circle cx="740" cy="684" r="56"/>
  </g>
</svg>
