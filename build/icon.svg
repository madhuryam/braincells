<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App icon: an AI-style brain — half organic folds, half circuit
       nodes — filled with the app's violet→periwinkle accent gradient
       on a transparent background. -->
  <defs>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#845ef7"/>
      <stop offset="1" stop-color="#5c7cfa"/>
    </linearGradient>
  </defs>

  <g transform="translate(512 512) scale(1.45)">
    <!-- brain silhouette: two lobes -->
    <path d="M -22 -268
             C -120 -290 -206 -246 -232 -168
             C -318 -152 -352 -64 -318 6
             C -352 78 -318 168 -240 192
             C -218 268 -128 300 -54 268
             C -34 258 -22 242 -22 218
             Z"
          fill="url(#brain)"/>
    <path d="M 22 -268
             C 120 -290 206 -246 232 -168
             C 318 -152 352 -64 318 6
             C 352 78 318 168 240 192
             C 218 268 128 300 54 268
             C 34 258 22 242 22 218
             Z"
          fill="url(#brain)"/>

    <!-- left lobe: organic folds -->
    <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity="0.92">
      <path d="M -78 -212 C -150 -196 -168 -140 -140 -96"/>
      <path d="M -238 -110 C -262 -52 -240 -10 -186 6"/>
      <path d="M -256 66 C -244 122 -200 150 -148 142"/>
      <path d="M -164 216 C -110 232 -72 208 -64 162"/>
      <path d="M -120 -40 C -80 -18 -74 30 -104 66"/>
    </g>

    <!-- right lobe: circuit traces and nodes -->
    <g stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M 70 -190 L 70 -110 L 150 -110"/>
      <path d="M 214 -150 L 214 -40 L 120 -40 L 120 60"/>
      <path d="M 250 60 L 170 60 L 170 150"/>
      <path d="M 70 230 L 70 130 L 236 130"/>
    </g>
    <g fill="#ffffff">
      <circle cx="70" cy="-190" r="30"/>
      <circle cx="150" cy="-110" r="30"/>
      <circle cx="214" cy="-150" r="30"/>
      <circle cx="120" cy="60" r="30"/>
      <circle cx="250" cy="60" r="30"/>
      <circle cx="170" cy="150" r="30"/>
      <circle cx="70" cy="230" r="30"/>
      <circle cx="236" cy="130" r="30"/>
    </g>
  </g>
</svg>
